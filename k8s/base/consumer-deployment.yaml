# In plain English: the Kafka reader. It runs the SAME image as the knowledge service but
# starts a different program (python -m app.consumer) that takes approved examples off the
# "approved-examples" topic and saves them. It is its own Deployment so it can be
# scaled on its own later (more readers when the queue grows). It listens on no port, so it
# has no probes and no Service; if it crashes, Kubernetes restarts it and the message that
# was in hand is read again (it is only marked done after it is dealt with).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-consumer
  namespace: knowledge
  labels:
    # Rolled out AFTER the database changes, like the service, so a new reader never
    # starts on an old table.
    deploy-phase: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-consumer
  template:
    metadata:
      labels:
        app: knowledge-consumer
    spec:
      # No Kubernetes API token: this pod never talks to the Kubernetes API, and a stolen token would be a
      # free key to it.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Lets the user above read the mounted Secret files.
        fsGroup: 1000
        # The container runtime's default filter blocks dozens of rarely used system calls.
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # A small, size-limited scratch folder, because the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-password
          secret:
            secretName: knowledge-db
            defaultMode: 0440
            items:
              - key: app-password
                path: app-password
      containers:
        - name: knowledge-consumer
          # Same image name as the service; each overlay adds the version tag.
          image: knowledge-service
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-password
              mountPath: /etc/secrets/db
              readOnly: true
          command: ["python", "-m", "app.consumer"]
          envFrom:
            - configMapRef:
                name: knowledge-service-config
          env:
            # DB_PASSWORD is read from a file that Kubernetes mounts from the Secret (see app/secret_files.py),
            # not passed as an environment variable.
            - name: DB_PASSWORD_FILE
              value: /etc/secrets/db/app-password
          securityContext:
            allowPrivilegeEscalation: false
            # Nothing in the image can be changed while it runs. Anything that must be written goes in /tmp.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The embedding model lives in memory, so allow room for it.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
